name: Bug report
description: Report a reproducible problem with the integration
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Privacy check
      options:
        - label: I removed phone numbers, passwords, tokens, watch IDs, names, and coordinates.
          required: true
  - type: input
    attributes:
      label: Integration version
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: textarea
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    attributes:
      label: How can it be reproduced?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Redacted diagnostics or logs
      description: Do not include personal data or credentials.
